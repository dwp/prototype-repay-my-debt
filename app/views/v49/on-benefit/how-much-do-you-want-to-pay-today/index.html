{% extends "layout-main.html" %}

{% block pageTitle %}
  How much do you want to pay each month? – {{ serviceName }} – GOV.UK Prototype Kit
{% endblock %}

{% block content %}

  <div class="govuk-grid-row">
    <div class="govuk-grid-column-two-thirds">
      <form class="form" action="../smaller-one-off-payment-summary/index.html">

      <fieldset class="govuk-fieldset" role="group" aria-describedby="passport-issued-hint">
        <legend class="govuk-fieldset__legend govuk-fieldset__legend--xl">
          <h1 class="govuk-fieldset__heading">
            How much do you want to pay today?
          </h1>
        </legend>

        <br>

         <div>
        <p>
            Total amount left to pay: <br> <span class="total-amount">
            &pound;300.00
            </span>
        </p>
    </div>

        <div class="govuk-input__wrapper">
            <div class="govuk-input__prefix" aria-hidden="true">£</div>
            <input class="govuk-input govuk-input--width-10" id="currency" name="currency" type="text" spellcheck="false" aria-describedby="currency-hint">
        </div>

        <br>

        <div class="govuk-button-group">
          <button type="submit" class="govuk-button" data-module="govuk-button">
            Continue
          </button>
        </div>

        </fieldset>

      </form>
    </div>
  </div>

{% endblock %}
